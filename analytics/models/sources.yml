sources:
  - name: price
    database: raw
    schema: equity_dashboard_yfinance
    tables:
      - name: raw_dim_security
        description: >
          Contains information about various securities, including their ticker symbols, company names, 
          and the exchanges they are listed on. It also categorizes them by types, sectors, and industries.
      - name: raw_dim_date
        description: >
          Provides a comprehensive view of date-related information, includes data such as year, 
          quarter, month, and the start of the week.
      - name: raw_fact_price_daily
        description: >
          This table contains daily pricing data for various stock tickers. It includes metrics such as 
          opening price, closing price, daily highs and lows, trading volume, and dividend information.
      - name: raw_fact_security_snapshot
        description: >
          This table contains snapshots of equity security data over time. It includes metrics 
          such as market capitalization, volume, and various performance ratios (like P/E and forward P/E).
      - name: raw_fact_price_targets
        description: >
          This table contains data on price targets for various stocks as reported by analysts. 
          It includes the current price, predicted high, low, mean, and median targets.

  - name: financial
    database: raw
    schema: equity_dashboard_edgar
    tables:
      - name: raw_balance_sheets_quarterly
        description: >
          Quarterly balance sheet line items per ticker from SEC EDGAR, in long format with one row
          per line item per period. Covers Q1 to Q3 only, because the year-end balance sheet appears in the yearly table.
      - name: raw_balance_sheets_yearly
        description: >
          Annual balance sheet line items per ticker from SEC EDGAR, in long format.
          These are the year-end snapshots, so they also stand in for Q4 in the quarterly series.
      - name: raw_cash_flows_quarterly
        description: >
          Quarterly cash flow statement line items per ticker from SEC EDGAR, in long format
          with one row per line item per fiscal quarter.
      - name: raw_cash_flows_yearly
        description: >
          Annual cash flow statement line items per ticker from SEC EDGAR,
          in long format with one row per line item per fiscal year.
      - name: raw_income_statements_quarterly
        description: >
          Quarterly income statement line items per ticker from SEC EDGAR, 
          in long format with one row per line item per fiscal quarter.
      - name: raw_income_statements_yearly
        description: >
          Annual income statement line items per ticker from SEC EDGAR,
          in long format with one row per line item per fiscal year.