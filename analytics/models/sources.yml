sources:
  - name: price
    database: raw
    schema: equity_dashboard
    tables:
      - name: raw_dim_security
        description: >
          Contains information about various securities, including their ticker symbols, company names, 
          and the exchanges they are listed on. It also categorizes them by types, sectors, and industries.
      - name: raw_dim_date
        description: >
          Provides a comprehensive view of date-related information, includes data such as year, 
          quarter, month, and the start of the week.
      - name: raw_fact_price_daily
        description: >
          The table contains daily pricing data for various stock tickers. It includes metrics such as 
          opening price, closing price, daily highs and lows, trading volume, and dividend information.
      - name: raw_fact_security_snapshot
        description: >
          The table contains snapshots of equity security data over time. It includes metrics 
          such as market capitalization, volume, and various performance ratios (like P/E and forward P/E).