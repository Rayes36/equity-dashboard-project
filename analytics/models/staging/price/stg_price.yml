models:
  - name: stg_price__security_info
    description: "One row per ticker with company details from Yahoo Finance."
    columns:
      - name: ticker
        description: "Stock ticker symbol."
        data_tests:
          - not_null
          - unique
      - name: company_name
        description: "Short company name, trimmed of extra spaces."
      - name: exchange
        description: "Exchange the stock is listed on."
      - name: type
        description: "Security type, for example equity."
      - name: sector
        description: "Business sector."
      - name: industry
        description: "Industry within the sector."
      - name: market
        description: "Market the security trades in."
      - name: currency
        description: "Currency the security is quoted in."
      - name: ingested_at
        description: "UTC time the extract run loaded this row."
        data_tests:
          - not_null

  - name: stg_price__date
    description: "Calendar table with one row per date, generated by the extract notebook."
    columns:
      - name: date
        description: "Calendar date."
        data_tests:
          - not_null
          - unique
      - name: year
        description: "Calendar year."
      - name: quarter
        description: "Calendar quarter (1 to 4)."
      - name: month
        description: "Calendar month (1 to 12)."
      - name: week_start
        description: "Monday of the week the date falls in."
        data_tests:
          - not_null

  - name: stg_price__price_daily
    description: "Daily prices and volume per ticker, one row per ticker per trading day."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, date]
    columns:
      - name: ticker
        description: "Stock ticker symbol."
        data_tests:
          - not_null
      - name: date
        description: "Trading date."
        data_tests:
          - not_null
      - name: open
        description: "Price at market open."
      - name: high
        description: "Highest price of the day."
      - name: low
        description: "Lowest price of the day."
      - name: close
        description: "Closing price, adjusted for splits but not dividends."
        data_tests:
          - not_null
      - name: adj_close
        description: "Closing price adjusted for splits and dividends."
      - name: volume
        description: "Number of shares traded."
      - name: dividends
        description: "Dividend paid per share that day (usually 0)."
      - name: stock_splits
        description: "Split ratio on that day (usually 0)."
      - name: ingested_at
        description: "UTC time the extract run loaded this row."
        data_tests:
          - not_null

  - name: stg_price__security_snapshot
    description: "Valuation and trading metrics per ticker, captured at each extract run."
    columns:
      - name: ticker
        description: "Stock ticker symbol."
        data_tests:
          - not_null
          - unique
      - name: snapshot_date
        description: "Date the snapshot was taken."
        data_tests:
          - not_null
      - name: market_cap
        description: "Total market value of the company."
      - name: dividend_yield
        description: "Annual dividend as a percentage of price (0.26 means 0.26%)."
      - name: volume
        description: "Shares traded in the latest session."
      - name: avg_volume
        description: "Average daily trading volume reported by Yahoo."
      - name: beta
        description: "How much the stock moves relative to the market."
      - name: pe
        description: "Trailing price-to-earnings ratio."
      - name: forward_pe
        description: "Price-to-earnings ratio using forecast earnings."
      - name: eps
        description: "Trailing earnings per share."
      - name: forward_eps
        description: "Forecast earnings per share. Can be below trailing EPS."
      - name: peg_ratio
        description: "P/E ratio divided by expected earnings growth."
      - name: shares_outstanding
        description: "Shares outstanding."
      - name: ingested_at
        description: "UTC time the extract run loaded this row."
        data_tests:
          - not_null

  - name: stg_price__price_targets
    description: "Analyst price targets and rating consensus per ticker, captured at each extract run."
    columns:
      - name: ticker
        description: "Stock ticker symbol."
        data_tests:
          - not_null
          - unique
      - name: snapshot_date
        description: "Date the targets were pulled."
        data_tests:
          - not_null
      - name: current_price
        description: "Stock price at the time the targets were pulled."
      - name: target_high
        description: "Highest analyst price target."
      - name: target_low
        description: "Lowest analyst price target."
      - name: target_mean
        description: "Average analyst price target."
      - name: target_median
        description: "Median analyst price target."
      - name: analyst_rating_mean
        description: "Average analyst rating from 1 (strong buy) to 5 (sell). Lower is more bullish."
      - name: analyst_rating
        description: "Consensus rating label, for example strong buy."
      - name: analyst_count
        description: "Number of analysts behind the targets and rating."
      - name: ingested_at
        description: "UTC time the extract run loaded this row."
        data_tests:
          - not_null