models:
  - name: int_revenue_expenses_breakdown__quarterly
    description: >
      "Quarterly revenue and expense breakdown per ticker: revenue, cost of revenue, gross profit,
      net income, operating expenses, SG&A, R&D, and other expenses.
      One row per line item per fiscal quarter."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, label, period]
    columns:
      - name: ticker
        description: "Stock ticker symbol."
        data_tests:
          - not_null
      - name: label
        description: "Display name of the line item, for example Total Revenue."
        data_tests:
          - not_null
      - name: period
        description: "Fiscal quarter label, for example Q2 2026. It follows the company's own fiscal calendar."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "RLIKE '^Q[1-4] [0-9]{4}$'"
      - name: quarter
        description: "Extracted quarter from the period column."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "RLIKE '^[1-4]{1}$'"
      - name: year
        description: "Extracted year from the period column."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "RLIKE '^[0-9]{4}$'"
      - name: value
        description: "Reported amount for the line item. Per-share and share count rows are in their own units, not dollars."
        data_tests:
          - not_null
      - name: data_updated_at
        description: "UTC time the extract run loaded the data."
        data_tests:
          - not_null

  - name: int_revenue_expenses_breakdown__ttm
    description: >
      "Trailing twelve month revenue and expense breakdown per ticker, summed over the latest
      four consecutive fiscal quarters for each line item."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ticker, label, period]
    columns:
      - name: ticker
        description: "Stock ticker symbol."
        data_tests:
          - not_null
      - name: label
        description: "Display name of the line item, for example Total Revenue."
        data_tests:
          - not_null
      - name: period
        description: "Fiscal quarter label, for example Q2 2026. It follows the company's own fiscal calendar."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "RLIKE '^Q[1-4] [0-9]{4}$'"
      - name: quarter
        description: "Extracted quarter from the period column."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "RLIKE '^[1-4]{1}$'"
      - name: year
        description: "Extracted year from the period column."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "RLIKE '^[0-9]{4}$'"
      - name: value
        description: "Reported amount for the line item. Per-share and share count rows are in their own units, not dollars."
        data_tests:
          - not_null
      - name: data_updated_at
        description: "UTC time the extract run loaded the data."
        data_tests:
          - not_null